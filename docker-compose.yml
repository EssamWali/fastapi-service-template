services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_API_KEYS: dev-key-change-me
      APP_DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      APP_REDIS_URL: redis://redis:6379/0
    # Migrations run before the server accepts traffic. Never let the app create
    # its own tables at startup - that is how two replicas race each other.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
